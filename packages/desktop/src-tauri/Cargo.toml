[package]
name = "git-qa-desktop"
version = "0.0.0"
description = "git-qa のデスクトップ画面（Tauri シェル）"
license = "MIT"
repository = "https://github.com/meta-taro/git-qa"
edition = "2021"
rust-version = "1.77.2"

# 個人名・個人メールを残さない（product-baseline §25）ため authors は置かない。

[lib]
name = "git_qa_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.6.3", features = [] }

[dependencies]
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
log = "0.4"
tauri = { version = "2.11.3", features = [] }
tauri-plugin-log = "2"
