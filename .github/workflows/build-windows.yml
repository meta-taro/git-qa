name: build-windows

# Windows 版を建てる。**Windows 機を持たずに配れるようにするため。**
#
# roadmap の Phase 1 は元々「Windows + Web」だった。書き直しが要るのは
# デスクトップ検証（`adapter-desktop`）だけで、ウェブと Android は同じコードで動く見込み
# （macOS 依存のファイルを数えた結果: core / adapter-android / host / 画面 は 0 件）。
#
# **建つことと、動くことは別。**建った `.msi` を Windows PC に入れて、
# ウェブ検証が本当に動くかを見るのは人の作業。ここは「配れる形にする」までを引き受ける。

on:
  # **毎回は走らせない。**Windows のランナーは高い（Linux の 2 倍）。
  # 配る番になったら、人が押して走らせる。
  workflow_dispatch:
  push:
    tags:
      - 'v*'

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm

      # Tauri は Rust で建つ。Windows のランナーには入っているが、版を固定しておく。
      - uses: dtolnay/rust-toolchain@stable

      # 建て直しを速くする（Rust の中間物を残す）。
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: packages/desktop/src-tauri

      - name: 依存を入れる
        run: pnpm install --frozen-lockfile

      # **建てる前に門を通す。**落ちるものを配らない（§5）。
      - name: format / lint / typecheck / test
        run: pnpm verify

      # **配る前に数える**（§23）。参照されているのに無いものがあれば、ここで止める。
      # 普段のゲート（`pnpm verify`）には入れていない —— 建てる道具が無い環境でも
      # 開発は進められるようにしてあり、そこで落とすと開発が止まるため。
      - name: 配布物が参照しているものが在るか数える
        run: pnpm check:assets

      - name: Windows 版を建てる
        run: pnpm --filter @git-qa/desktop exec tauri build

      # 署名はしていない。**受け取る側が「発行元を確認できません」を踏む。**
      # 署名は人の作業（§14）。ここで秘密情報を扱わない。
      - name: 建ったものを置いていく
        uses: actions/upload-artifact@v4
        with:
          name: git-qa-windows
          path: |
            packages/desktop/src-tauri/target/release/bundle/msi/*.msi
            packages/desktop/src-tauri/target/release/bundle/nsis/*.exe
          if-no-files-found: error
