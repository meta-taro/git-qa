name: pages

# **配布ページ（`site/`）を GitHub Pages へ出す。**
#
# アルファ版として DL ページを置く（2026-09-11・人の判断）。
# まだアルファ版なので、**署名はまだ無い。**そのことはページに書いてある。
#
# **版と落とす先は、ページの JS が Releases から読む。**ここで埋め込まない ——
# 埋め込むと、タグを打つたびにページを直す作業が増え、**忘れた分だけ古い物を配る。**
#
# 使う action は `actions/*`（GitHub 自身のもの）だけにする。
# Pages は専用の口（`upload-pages-artifact` / `deploy-pages`）でしか出せないので、
# **ここだけは足す**（product-baseline §12 —— 足す理由を書く）。
#
# ## 人の作業が 1 回だけ要る
#
# Settings → Pages → Source を **GitHub Actions** にすること。
# そこまでは、この workflow が走っても配られない。

on:
  push:
    branches:
      - develop
    paths:
      - 'site/**'
      - '.github/workflows/pages.yml'
  # タグを打った後に手で出せるようにしておく（配布物の名前が変わったときの確認用）。
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# 走っている途中のものは止めてよい（配るのは常に最新の 1 つ）。
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url || steps.deploy_again.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7

      # **アイコンはここで写す。**`site/` に置いたものが古くならないように、
      # 配るたびにアプリの実物から取り直す（DESIGN.md の「別の物？と思わせない」）。
      - name: アイコンを写す
        run: |
          # **アットマークの付いた名前は使わない。**個人情報検査がメールアドレスと
          # 見なして落ちる（2026-09-11・実際に落ちた）。同じ絵の別名を使う。
          cp packages/desktop/src-tauri/icons/128x128-2x.png site/icon.png
          ls -l site

      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: site

      # **上げ終えた直後は、配る側の一覧にまだ出ないことがある。**その 0.3 秒後に deploy が
      # 「github-pages という成果物が無い」で落ちた（2026-11-25・4 回中 3 回。action の版を
      # 上げても、REST の一覧に出るのを待っても同じ。配る側は別の口で一覧を引く）。
      # 1 回目が落ちたら、少し置いてもう 1 回だけ配る。job の再実行は同じ run に成果物が
      # 2 つ残って別の理由で落ちるので、使わない。
      - id: deploy
        uses: actions/deploy-pages@v5
        continue-on-error: true

      - if: steps.deploy.outcome == 'failure'
        name: 少し置いて、もう 1 回配る
        run: sleep 20

      - id: deploy_again
        if: steps.deploy.outcome == 'failure'
        uses: actions/deploy-pages@v5
