name: dev-build

# **開発版を、他の OS の人へ渡す口**（2026-09-19・人の指示）。
#
# > 開発版としてプッシュして、win 側の開発動作確認を渡して各々の OS で開発していきましょう
#
# `develop` に入るたびに建てて、**転がる `dev` という版**として置く。
# 受け取る側は、いつでも「いまの develop」を落とせる。
#
# **Windows だけ建てる。**
#
# - Windows 版は**署名していない**ので、そのまま配れる（もともと警告が出る前提）
# - macOS 版は**署名と公証が要る** —— 無い `.dmg` は「壊れているため開けません」になり、
#   **渡せないものが出来る。**mac 側は手元から動かす（`pnpm app`）のが普通の道
#
# **mac の開発版が要るようになったら、ここへ署名の段を足す**（release.yml と同じもの）。

on:
  push:
    branches:
      - develop
    # **文書だけの変更では建てない。**2 つの走者を毎回起こすのは高い。
    paths:
      - 'packages/**'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - '.github/workflows/dev-build.yml'
  workflow_dispatch:

permissions:
  contents: write

# **名乗りを `dev-<短い sha>` にする**（C70）。
#
# **配った版と混ぜない。**この形は版として読めないので、
# **「新しい版が出ています」も出ない**（C71）—— 開発版を使っている人を急かさない。
env:
  GIT_QA_RELEASE: dev-${{ github.sha }}

concurrency:
  group: dev-build
  # **古い開発版を建て続けない。**新しいものが来たら、そちらだけでよい。
  cancel-in-progress: true

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - uses: dtolnay/rust-toolchain@stable
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: packages/desktop/src-tauri

      - name: 依存を入れる
        run: pnpm install --frozen-lockfile

      # **開発版でもゲートは抜かない**（baseline §18・急ぐときに縮めるのはスコープだけ）。
      - name: format / lint / typecheck / test
        run: pnpm verify

      - name: 配布物が参照しているものが在るか数える
        run: pnpm check:assets

      # **名乗りを短くする。**`dev-<40 桁>` は画面で読めない。
      - name: 名乗りを決める
        shell: bash
        run: echo "GIT_QA_RELEASE=dev-$(git rev-parse --short HEAD)" >> "$GITHUB_ENV"

      - name: Windows 版を建てる
        run: pnpm --filter @git-qa/desktop exec tauri build

      - uses: actions/upload-artifact@v4
        with:
          name: git-qa-dev-windows
          path: |
            packages/desktop/src-tauri/target/release/bundle/msi/*.msi
            packages/desktop/src-tauri/target/release/bundle/nsis/*.exe
          if-no-files-found: error

  publish:
    needs: [windows]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v4
        with:
          path: dist

      - name: 何を置くのかを出す
        run: find dist -type f -exec ls -lh {} \;

      # **転がる 1 本だけ置く。**開発版が溜まると、どれが最新か分からなくなる。
      #
      # **`v*` には絶対に触らない。**消すのは `dev` だけ。
      - name: dev を置き直す
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          short="$(git rev-parse --short HEAD)"

          cat > /tmp/dev-notes.md <<NOTES
          **開発版です。壊れていることがあります。**

          いまの \`develop\` を建てたものです。**名乗りは \`dev-${short}\`** で、
          アプリの準備の画面に出ます。
          **「新しい版が出ています」は出ません**（開発版なので急かしません）。

          - **Windows だけ**置いています（macOS は手元から動かしてください）
          - **署名していません。**「WindowsによってPCが保護されました」が出ます
          - 何が動くかは \`pnpm doctor\` で測れます。**その出力をそのまま Issue へ貼ってください**

          配った版が要るときは、リリース一覧の \`v0.2.0-beta.*\` を使ってください。
          NOTES

          gh release delete dev --yes --cleanup-tag || true
          gh release create dev \
            --target "${GITHUB_SHA}" \
            --title "開発版（dev-${short}）" \
            --prerelease \
            --notes-file /tmp/dev-notes.md \
            $(find dist -type f)
